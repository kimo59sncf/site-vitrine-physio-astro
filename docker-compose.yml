services:
  physiotherapie-site:
    build: .
    container_name: physio-site-container
    ports:
      - "8080:4327"
    environment:
      NODE_ENV: production
      PORT: 4327
      HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4327/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - physio-network

  nginx:
    image: nginx:alpine
    container_name: physio-nginx
    expose:
      - "80"
      - "443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - physiotherapie-site
    restart: unless-stopped
    networks:
      - physio-network

networks:
  physio-network:
    driver: bridge
