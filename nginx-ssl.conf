events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name physiokbnyon.ch www.physiokbnyon.ch;

        # Challenge ACME (renouvellement Let's Encrypt en mode webroot si besoin)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name physiokbnyon.ch www.physiokbnyon.ch;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Umami (analytics auto-heberge)
        # - resolver Docker + variable : nginx demarre meme si le conteneur
        #   umami est absent (evite "host not found in upstream")
        # - "location = /umami" : casse la boucle 301/308 (Umami redirige
        #   /umami/ -> /umami ; sans ce bloc, /umami retombait sur l'app
        #   Astro qui redirigeait vers /umami/ -> boucle infinie)
        location = /umami {
            resolver 127.0.0.11 valid=10s;
            set $umami_root http://umami:3000;
            proxy_pass $umami_root;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        # Securite : ne pas indexer l'admin et l'analytics
        location /umami/ {
            resolver 127.0.0.11 valid=10s;
            set $umami_upstream http://umami:3000;
            proxy_pass $umami_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        location /images/ {
            proxy_pass http://physiotherapie-site:4327/images/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://physiotherapie-site:4327;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
