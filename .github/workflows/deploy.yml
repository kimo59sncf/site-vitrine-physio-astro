name: Deploy to VPS (Docker)

on:
  push:
    branches:
      - master
      - dev
  # Permet le déclenchement manuel et par d'autres workflows
  # (utilisé par weekly-blog.yml après la publication d'un article)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "╔════════════════════════════════════════════════════════════╗"
            echo "║   Déploiement auto CI/CD - Site Physiothérapie            ║"
            echo "╚════════════════════════════════════════════════════════════╝"

            BRANCH="${{ github.ref_name }}"
            PROJECT_DIR="$HOME/app/physio-site"

            # Si le projet n'existe pas encore, le cloner
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📂 Clonage initial du repository..."
              mkdir -p "$PROJECT_DIR"
              git clone -b "$BRANCH" https://github.com/kimo59sncf/site-vitrine-physio-astro.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # Rendre le script exécutable et lancer
            chmod +x vps-auto-deploy.sh
            BRANCH="$BRANCH" ./vps-auto-deploy.sh
